# Load jpeg-sixel and run its suite, on Linux and macOS.
#
# The encoder is pure Lisp over cl-jpeg, so both runners are the same job with
# a different SBCL.  Two are worth having anyway: the quantizer and the sixel
# writer do a great deal of fixnum arithmetic and array indexing, and "it
# worked on the machine it was written on" is exactly the claim CI is for.
#
# Dependencies are vendored with ocicl -- ocicl.csv is tracked and pins them,
# ocicl/ is not -- so a clean checkout has to restore them before anything
# will load.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: sbcl · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install SBCL
        run: |
          set -eux
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install sbcl
          else
            sudo apt-get update
            sudo apt-get install -y sbcl
          fi
          sbcl --version

      - name: Install and configure ocicl
        # The clone and the setup each get a watchdog and three attempts.  A
        # hang here would otherwise sit until the job timeout having run no
        # tests at all; macOS ships no timeout(1), hence the watchdog.
        run: |
          attempt_with_timeout() {
            local secs=$1; shift
            ( "$@" ) & local pid=$!
            ( sleep "$secs"; kill -9 "$pid" 2>/dev/null ) & local watchdog=$!
            local rc=0; wait "$pid" || rc=$?
            kill -9 "$watchdog" 2>/dev/null || true
            return $rc
          }
          clone_ocicl() {
            rm -rf "$HOME/ocicl-src"
            git clone --depth 1 https://github.com/ocicl/ocicl.git "$HOME/ocicl-src"
          }
          setup_ocicl() {
            ( cd "$HOME/ocicl-src" && sbcl --non-interactive --load setup.lisp )
          }
          for attempt in 1 2 3; do
            if attempt_with_timeout 300 clone_ocicl && attempt_with_timeout 300 setup_ocicl; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::ocicl could not be installed after 3 attempts" >&2
              exit 1
            fi
            echo "::warning::ocicl install attempt $attempt failed or hung; retrying"
            sleep 15
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore dependencies
        # ocicl exits 0 when a download fails and ghcr.io fails often enough to
        # matter, so the log is the thing to test and a failure belongs here,
        # on the line that names the package, rather than two steps later as
        # "Component not found".
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ocicl setup
          for attempt in 1 2 3 4 5; do
            ocicl install 2>&1 | tee ocicl-install.log
            if ! grep -q "failed to install" ocicl-install.log; then
              break
            fi
            echo "::warning::ocicl install attempt $attempt did not get every package"
            sleep 30
          done
          if grep -q "failed to install" ocicl-install.log; then
            echo "::error::ocicl could not install every dependency after 5 attempts" >&2
            exit 1
          fi

      - name: Run the suite
        # Nothing inherited: no ~/.sbclrc, no site init, and a source registry
        # built from this tree alone.  A dependency the lock file forgot should
        # fail here rather than resolve to whatever the runner happens to have.
        run: |
          sbcl --non-interactive --no-userinit --no-sysinit \
            --eval '(require :asdf)' \
            --eval '(asdf:initialize-source-registry `(:source-registry (:tree ,(truename "./")) :ignore-inherited-configuration))' \
            --eval '(asdf:test-system :jpeg-sixel)'
